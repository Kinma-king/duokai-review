<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}多开复盘{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231a1a2e'/><text x='8' y='48' font-family='Arial Black,sans-serif' font-size='36' font-weight='900' fill='%23e63946' letter-spacing='-2'>DK</text><rect x='8' y='46' width='44' height='3' rx='1.5' fill='%23e63946' opacity='0.6'/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --up-color: #e63946;
            --down-color: #2ecc71;
            --accent-color: #e63946;
            --warning-color: #f0a500;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header */
        .header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 900;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
        }

        .logo-text {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e63946 0%, #ff6b6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            margin: 0 16px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
        }

        /* Search Results Dropdown */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 4px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 200;
        }

        .search-results.active {
            display: block;
        }

        .search-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }

        .search-item:hover {
            background-color: var(--bg-tertiary);
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .search-item-code {
            color: var(--accent-color);
            font-weight: bold;
            margin-right: 8px;
        }

        .search-item-name {
            color: var(--text-primary);
        }

        /* Main Content */
        .main-content {
            padding: 20px 0;
        }

        /* Cards */
        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Stock List */
        .stock-list {
            display: grid;
            gap: 12px;
        }

        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .stock-item:hover {
            background-color: var(--border-color);
            transform: translateX(4px);
        }

        .stock-info {
            flex: 1;
        }

        .stock-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .stock-code {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stock-price {
            text-align: right;
        }

        .stock-price-value {
            font-size: 18px;
            font-weight: bold;
        }

        .stock-change {
            font-size: 13px;
            margin-top: 2px;
        }

        .up { color: var(--up-color); }
        .down { color: var(--down-color); }

        /* Chart Container */
        .chart-container {
            width: 100%;
            height: 400px;
            background-color: var(--bg-tertiary);
            border-radius: 8px;
            padding: 8px;
        }

        /* Period Selector */
        .period-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .period-btn {
            padding: 6px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .period-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .period-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Analysis Panel */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .analysis-item {
            background-color: var(--bg-tertiary);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-color);
        }

        .analysis-item.sell { border-left-color: var(--up-color); }
        .analysis-item.buy { border-left-color: var(--down-color); }

        .analysis-indicator {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .analysis-signal {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .analysis-trend {
            font-size: 13px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content { flex-wrap: wrap; }
            .search-box {
                order: 3;
                max-width: 100%;
                margin: 12px 0 0 0;
                flex-basis: 100%;
            }
            .chart-container { height: 300px; }
            .analysis-grid { grid-template-columns: 1fr; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">
                    <span class="logo-icon">
                        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="dkGrad" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#e63946"/>
                                    <stop offset="100%" stop-color="#c1121f"/>
                                </linearGradient>
                            </defs>
                            <rect x="1" y="1" width="34" height="34" rx="7" fill="#1a1a2e" stroke="url(#dkGrad)" stroke-width="2"/>
                            <text x="3" y="27" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="22" font-weight="900" fill="url(#dkGrad)" letter-spacing="-1.5">DK</text>
                            <rect x="3" y="29" width="25" height="2" rx="1" fill="url(#dkGrad)" opacity="0.4"/>
                        </svg>
                    </span>
                    <span class="logo-text">多开复盘</span>
                </a>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索股票代码或名称..." autocomplete="off">
                    <button class="search-btn" onclick="searchStock()">🔍</button>
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        // Search functionality
        let searchTimeout;
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.trim();
            
            if (query.length < 2) {
                searchResults.classList.remove('active');
                return;
            }

            searchTimeout = setTimeout(() => {
                fetch(`/api/search?q=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        searchResults.innerHTML = '';
                        if (data.length > 0) {
                            data.forEach(stock => {
                                const div = document.createElement('div');
                                div.className = 'search-item';
                                div.innerHTML = `
                                    <span class="search-item-code">${stock.code}</span>
                                    <span class="search-item-name">${stock.name}</span>
                                `;
                                div.onclick = () => {
                                    window.location.href = `/stock/${stock.code}`;
                                };
                                searchResults.appendChild(div);
                            });
                            searchResults.classList.add('active');
                        } else {
                            searchResults.classList.remove('active');
                        }
                    });
            }, 300);
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box')) {
                searchResults.classList.remove('active');
            }
        });

        function searchStock() {
            const query = searchInput.value.trim();
            if (!query) return;
            // 如果有联想结果且第一个可见，跳到第一个
            const items = searchResults.querySelectorAll('.search-item');
            if (searchResults.classList.contains('active') && items.length > 0) {
                items[0].click();
            } else {
                // 否则直接拼接搜索
                window.location.href = `/api/search?q=${encodeURIComponent(query)}`;
            }
        }

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { 
                e.preventDefault();
                searchStock(); 
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
