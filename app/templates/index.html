{% extends "base.html" %}

{% block title %}多开复盘 - 首页{% endblock %}

{% block content %}
<!-- 大盘指数 -->
<div class="card">
    <div class="card-title">
        <span>📊 大盘</span>
        <span style="font-size: 12px; color: var(--text-secondary);">点击指数查看详情</span>
    </div>
    <div class="analysis-grid" id="marketStats">
        <a href="/stock/sh000001" class="analysis-item" style="text-decoration:none; cursor:pointer; color:inherit;">
            <div class="analysis-indicator">上证指数</div>
            <div class="analysis-signal up" id="shIndex">--</div>
            <div class="analysis-trend" id="shChange">--</div>
        </a>
        <a href="/stock/sz399001" class="analysis-item" style="text-decoration:none; cursor:pointer; color:inherit;">
            <div class="analysis-indicator">深证成指</div>
            <div class="analysis-signal up" id="szIndex">--</div>
            <div class="analysis-trend" id="szChange">--</div>
        </a>
        <a href="/stock/sz399006" class="analysis-item" style="text-decoration:none; cursor:pointer; color:inherit;">
            <div class="analysis-indicator">创业板指</div>
            <div class="analysis-signal up" id="cyIndex">--</div>
            <div class="analysis-trend" id="cyChange">--</div>
        </a>
    </div>
</div>

<!-- 热门股票 -->
<div class="card">
    <div class="card-title">
        <span>🔥 热门股票</span>
        <span style="font-size: 12px; color: var(--text-secondary);">实时行情</span>
    </div>
    <div class="stock-list" id="hotStocks">
        <div class="loading">
            <div class="spinner"></div>
            加载中...
        </div>
    </div>
    <div id="hotExpand" style="text-align:center; padding:8px; display:none;">
        <button onclick="toggleHotStocks()" style="background:var(--bg-tertiary); border:1px solid var(--border-color); color:var(--accent-color); padding:6px 20px; border-radius:6px; cursor:pointer; font-size:13px;">
            <span id="hotExpandText">展开全部</span>
        </button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let allHotStocks = [];
    let hotExpanded = false;

    // Load hot stocks
    function loadHotStocks() {
        fetch('/api/hot')
            .then(res => res.json())
            .then(stocks => {
                const container = document.getElementById('hotStocks');
                container.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
                
                allHotStocks = [];
                let loaded = 0;
                
                stocks.forEach((stock, idx) => {
                    fetch(`/api/quote/${stock.code}`)
                        .then(res => res.json())
                        .then(quote => {
                            const changeClass = quote.changePercent >= 0 ? 'up' : 'down';
                            const changeSign = quote.changePercent >= 0 ? '+' : '';
                            
                            const item = document.createElement('a');
                            item.className = 'stock-item';
                            item.href = `/stock/${stock.code}`;
                            item.setAttribute('data-idx', idx);
                            item.innerHTML = `
                                <div class="stock-info">
                                    <div class="stock-name">${stock.name}</div>
                                    <div class="stock-code">${stock.code}</div>
                                </div>
                                <div class="stock-price">
                                    <div class="stock-price-value ${changeClass}">${quote.price.toFixed(2)}</div>
                                    <div class="stock-change ${changeClass}">${changeSign}${quote.changePercent.toFixed(2)}%</div>
                                </div>
                            `;
                            allHotStocks[idx] = item;
                            loaded++;
                            if (loaded === stocks.length) renderHotStocks();
                        })
                        .catch(() => {
                            const item = document.createElement('a');
                            item.className = 'stock-item';
                            item.href = `/stock/${stock.code}`;
                            item.setAttribute('data-idx', idx);
                            item.innerHTML = `
                                <div class="stock-info">
                                    <div class="stock-name">${stock.name}</div>
                                    <div class="stock-code">${stock.code}</div>
                                </div>
                                <div class="stock-price">
                                    <div class="stock-price-value">--</div>
                                    <div class="stock-change">--</div>
                                </div>
                            `;
                            allHotStocks[idx] = item;
                            loaded++;
                            if (loaded === stocks.length) renderHotStocks();
                        });
                });
            });
    }

    function renderHotStocks() {
        const container = document.getElementById('hotStocks');
        const expandDiv = document.getElementById('hotExpand');
        container.innerHTML = '';
        
        const validStocks = allHotStocks.filter(s => s);
        const showCount = hotExpanded ? validStocks.length : Math.min(5, validStocks.length);
        
        for (let i = 0; i < showCount; i++) {
            container.appendChild(validStocks[i]);
        }
        
        if (validStocks.length > 5) {
            expandDiv.style.display = 'block';
            document.getElementById('hotExpandText').textContent = 
                hotExpanded ? `收起 (${validStocks.length}只)` : `展开全部 (${validStocks.length}只)`;
        } else {
            expandDiv.style.display = 'none';
        }
    }

    function toggleHotStocks() {
        hotExpanded = !hotExpanded;
        renderHotStocks();
    }

    // Load market indices
    function loadMarketIndices() {
        // Shanghai Composite
        fetch('/api/quote/sh000001')
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('shIndex');
                el.textContent = data.price.toFixed(2);
                el.className = 'analysis-signal ' + (data.changePercent >= 0 ? 'up' : 'down');
                const changeClass = data.changePercent >= 0 ? 'up' : 'down';
                const sign = data.changePercent >= 0 ? '+' : '';
                document.getElementById('shChange').innerHTML = 
                    `<span class="${changeClass}">${sign}${data.changePercent.toFixed(2)}%  ${sign}${data.change.toFixed(2)}</span>`;
            })
            .catch(() => {
                document.getElementById('shIndex').textContent = '---';
            });

        // Shenzhen Component
        fetch('/api/quote/sz399001')
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('szIndex');
                el.textContent = data.price.toFixed(2);
                el.className = 'analysis-signal ' + (data.changePercent >= 0 ? 'up' : 'down');
                const changeClass = data.changePercent >= 0 ? 'up' : 'down';
                const sign = data.changePercent >= 0 ? '+' : '';
                document.getElementById('szChange').innerHTML = 
                    `<span class="${changeClass}">${sign}${data.changePercent.toFixed(2)}%  ${sign}${data.change.toFixed(2)}</span>`;
            })
            .catch(() => {
                document.getElementById('szIndex').textContent = '---';
            });

        // ChiNext
        fetch('/api/quote/sz399006')
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('cyIndex');
                el.textContent = data.price.toFixed(2);
                el.className = 'analysis-signal ' + (data.changePercent >= 0 ? 'up' : 'down');
                const changeClass = data.changePercent >= 0 ? 'up' : 'down';
                const sign = data.changePercent >= 0 ? '+' : '';
                document.getElementById('cyChange').innerHTML = 
                    `<span class="${changeClass}">${sign}${data.changePercent.toFixed(2)}%  ${sign}${data.change.toFixed(2)}</span>`;
            })
            .catch(() => {
                document.getElementById('cyIndex').textContent = '---';
            });
    }

    // Initial load
    loadHotStocks();
    loadMarketIndices();

    // Auto refresh every 30 seconds
    setInterval(() => {
        loadHotStocks();
        loadMarketIndices();
    }, 30000);
</script>
{% endblock %}
